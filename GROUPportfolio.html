      body {

      .member {
        display: block;

        border-radius: 20px;
        box-shadow: 8px 8px 0 #1b1b1b;
        transition: transform 0.25s ease;
      }
      .member:hover {
        transform: translateY(-8px) rotate(-1deg);
      }
      /* Ảnh vuông, cắt gọn để mọi thẻ đều bằng nhau dù ảnh gốc to nhỏ khác nhau */
      .member img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 12px;
        display: block;
        margin-bottom: 16px;
      }
      .member h2 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      .member p {
        margin: 0;
      }
